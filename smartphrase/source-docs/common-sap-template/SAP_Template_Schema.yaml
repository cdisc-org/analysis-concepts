# SAP Template — Semantic Node Schema
# Machine-readable spine of SAP_Template_Master.md.
# Each node is a candidate entity in the SAP semantic data model.
# `id` is the stable primary key; `parent` builds the section tree; `placeholders` are the fillable slots (candidate attributes).
# enums: required[true|false] repeatable[true|false] estimand_linked[true|false]
#        source[veramed|coretee|both] produces[prose|table|tfl_shell|definition|none]

schema_version: 1.0
backbone: coretee_flow_plus_veramed_depth
placeholder_token_format: "{{snake_case}}"

nodes:
  - { id: title-page, parent: null, required: true, repeatable: false, estimand_linked: false, source: both, produces: definition }
  - { id: version-history, parent: null, required: true, repeatable: false, estimand_linked: false, source: coretee, produces: table }
  - { id: abbreviations, parent: null, required: true, repeatable: false, estimand_linked: false, source: both, produces: table }
  - { id: introduction, parent: null, required: true, repeatable: false, estimand_linked: false, source: both, produces: prose, ich_refs: ["E9(R1)"] }

  - { id: objectives-endpoints-estimands, parent: null, required: true, repeatable: false, estimand_linked: true, source: both, produces: table, ich_refs: ["E9(R1)"] }
  - { id: estimand, parent: objectives-endpoints-estimands, required: false, repeatable: true, estimand_linked: true, source: both, produces: definition, ich_refs: ["E9(R1)"],
      attributes: [clinical_question, treatment_condition, population, endpoint, intercurrent_events, population_summary, estimand_rationale] }

  - { id: study-methods, parent: null, required: true, repeatable: false, estimand_linked: false, source: both, produces: none, ich_refs: ["E3 §9","E9"] }
  - { id: study-design, parent: study-methods, required: true, repeatable: false, estimand_linked: false, source: both, produces: prose, ich_refs: ["E3 §9","E9"] }
  - { id: randomisation-blinding, parent: study-methods, required: true, repeatable: false, estimand_linked: false, source: veramed, produces: prose, ich_refs: ["E3 §9.4.3","E3 §9.4.6","E9 §2.3.1","E9 §2.3.2"] }
  - { id: derived-variables, parent: study-methods, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: definition }

  - { id: general-considerations, parent: null, required: true, repeatable: false, estimand_linked: false, source: both, produces: none, ich_refs: ["E9"] }
  - { id: hypotheses-decision-criteria, parent: general-considerations, required: false, repeatable: false, estimand_linked: true, source: coretee, produces: definition, ich_refs: ["E9 §2.2"] }
  - { id: analysis-sets, parent: general-considerations, required: true, repeatable: false, estimand_linked: true, source: both, produces: table, ich_refs: ["E3 §9.7.1","E3 §11.4.2.5","E9 §5.2"] }
  - { id: covariates-subgroups, parent: general-considerations, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: definition, ich_refs: ["E3 §9.7.1","E3 §11.4.2.1","E9 §5.7"] }
  - { id: missing-data, parent: general-considerations, required: true, repeatable: false, estimand_linked: true, source: both, produces: definition, ich_refs: ["E3 §9.7.1","E3 §11.4.2.2","E9 §5.3","EMA Missing Data"] }
  - { id: multiplicity, parent: general-considerations, required: false, repeatable: false, estimand_linked: false, source: both, produces: definition, ich_refs: ["E3 §9.7.1","E3 §11.4.2.5","E9 §2.2.5"] }
  - { id: intercurrent-events-impact, parent: general-considerations, required: false, repeatable: false, estimand_linked: true, source: coretee, produces: definition, ich_refs: ["E9(R1)"] }
  - { id: multicentre, parent: general-considerations, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: prose, ich_refs: ["E3 §9.7.1","E3 §11.4.2.4","E9 §3.2"] }

  - { id: interim-analyses, parent: null, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: none, ich_refs: ["E3 §9.7.1","E3 §11.4.2.3","E9 §4.1","FDA 2010 Adaptive Design"] }
  - { id: ia-purpose, parent: interim-analyses, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: prose }
  - { id: ia-schedule, parent: interim-analyses, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: prose }
  - { id: ia-adaptations, parent: interim-analyses, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: prose }
  - { id: ia-stopping-rules, parent: interim-analyses, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: definition }
  - { id: ia-bias-methods, parent: interim-analyses, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: prose }
  - { id: ia-ci-pvalue-adjust, parent: interim-analyses, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: definition }
  - { id: ia-ssr, parent: interim-analyses, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: definition }
  - { id: ia-practical-bias, parent: interim-analyses, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: definition }
  - { id: ia-documentation, parent: interim-analyses, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: prose }

  - { id: sample-size, parent: null, required: true, repeatable: false, estimand_linked: false, source: both, produces: prose, ich_refs: ["E3 §9.7.2","E9 §3.5"] }

  - { id: summary-of-study-data, parent: null, required: true, repeatable: false, estimand_linked: false, source: veramed, produces: definition }
  - { id: subject-disposition, parent: summary-of-study-data, required: true, repeatable: false, estimand_linked: false, source: veramed, produces: tfl_shell }
  - { id: protocol-deviations, parent: summary-of-study-data, required: true, repeatable: false, estimand_linked: false, source: veramed, produces: definition }
  - { id: demographics-baseline, parent: summary-of-study-data, required: true, repeatable: false, estimand_linked: false, source: veramed, produces: definition }
  - { id: medical-history, parent: summary-of-study-data, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: definition }
  - { id: prior-conmeds, parent: summary-of-study-data, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: definition }
  - { id: treatment-compliance, parent: summary-of-study-data, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: definition }

  - { id: efficacy-analyses, parent: null, required: true, repeatable: false, estimand_linked: true, source: both, produces: none }
  - { id: primary-efficacy, parent: efficacy-analyses, required: true, repeatable: false, estimand_linked: true, source: both, produces: definition }
  - { id: primary-endpoint-definition, parent: primary-efficacy, required: true, repeatable: false, estimand_linked: true, source: both, produces: definition }
  - { id: primary-main-approach, parent: primary-efficacy, required: true, repeatable: false, estimand_linked: true, source: both, produces: definition }
  - { id: primary-sensitivity, parent: primary-efficacy, required: false, repeatable: false, estimand_linked: true, source: both, produces: definition }
  - { id: primary-supplementary, parent: primary-efficacy, required: false, repeatable: false, estimand_linked: true, source: both, produces: definition }
  - { id: primary-subgroup, parent: primary-efficacy, required: false, repeatable: false, estimand_linked: true, source: both, produces: definition }
  - { id: secondary-efficacy, parent: efficacy-analyses, required: false, repeatable: true, estimand_linked: true, source: both, produces: definition }
  - { id: exploratory-efficacy, parent: efficacy-analyses, required: false, repeatable: true, estimand_linked: false, source: both, produces: definition }

  - { id: safety-analyses, parent: null, required: true, repeatable: false, estimand_linked: false, source: both, produces: definition }
  - { id: extent-of-exposure, parent: safety-analyses, required: true, repeatable: false, estimand_linked: false, source: both, produces: definition }
  - { id: adverse-events, parent: safety-analyses, required: true, repeatable: false, estimand_linked: false, source: both, produces: definition }
  - { id: deaths-saes, parent: safety-analyses, required: true, repeatable: false, estimand_linked: false, source: both, produces: definition }
  - { id: pregnancies, parent: safety-analyses, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: prose }
  - { id: laboratory, parent: safety-analyses, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: definition }
  - { id: other-safety, parent: safety-analyses, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: definition }

  - { id: pharmacokinetics, parent: null, required: false, repeatable: false, estimand_linked: false, source: veramed, produces: definition }
  - { id: other-analyses, parent: null, required: false, repeatable: true, estimand_linked: false, source: both, produces: definition }
  - { id: reporting-conventions, parent: null, required: true, repeatable: false, estimand_linked: false, source: veramed, produces: definition }
  - { id: technical-details, parent: null, required: true, repeatable: false, estimand_linked: false, source: veramed, produces: definition }
  - { id: changes-to-protocol, parent: null, required: true, repeatable: false, estimand_linked: false, source: both, produces: prose }
  - { id: references, parent: null, required: true, repeatable: false, estimand_linked: false, source: both, produces: prose }
  - { id: supporting-documentation, parent: null, required: false, repeatable: false, estimand_linked: false, source: coretee, produces: prose }
  - { id: sap-amendments, parent: null, required: false, repeatable: true, estimand_linked: false, source: veramed, produces: definition }
  - { id: tfl-appendix, parent: null, required: true, repeatable: false, estimand_linked: false, source: veramed, produces: tfl_shell }

# Cross-cutting relationships for the semantic model (edges beyond parent/child):
relationships:
  - { type: aligns_to, from: analysis-sets, to: estimand, note: "each analysis/data-points set maps to an estimand" }
  - { type: aligns_to, from: missing-data, to: estimand, note: "missing-data handling defined per estimand" }
  - { type: realises, from: primary-main-approach, to: estimand, note: "primary analysis operationalises the primary estimand" }
  - { type: realises, from: secondary-efficacy, to: estimand, note: "secondary analyses operationalise secondary estimands" }
  - { type: enumerates, from: tfl-appendix, to: [efficacy-analyses, safety-analyses, summary-of-study-data, pharmacokinetics], note: "every analysis node should yield 1..n TFL rows" }
  - { type: derives_from, from: introduction, to: changes-to-protocol, note: "changes statement points to the changes section" }
