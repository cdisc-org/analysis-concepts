# Analysis Concepts candidate v1 — transformation layer
# Origin: model/linkML/acdc_transformation.yaml on methods_02 (v0.3.0)
# Changes from the origin are listed in v1/docs/migration-notes.md.
id: https://cdisc.org/ac/transformation
name: ac_transformation
title: AC Transformation Model
description: >-
  Schema for the Transformation library. A Transformation applies one Method
  for a stated clinical purpose: it binds Concepts to the Method's input roles
  and outputs, and declares the data structures (W3C Data Cube
  qb:DataStructureDefinitions) the Method reads and produces, with the slices
  that subset them. A Transformation is either a derivation (subject-level
  output) or an analysis (aggregate output). It references Methods, Concepts
  and SmartPhrases by identifier and never names a physical variable.
version: "1.0.0-candidate"
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  ac:     https://cdisc.org/ac/
  qb:     http://purl.org/linked-data/cube#
  skos:   http://www.w3.org/2004/02/skos/core#
  rdf:    http://www.w3.org/1999/02/22-rdf-syntax-ns#

default_prefix: ac
default_range:  string

imports:
  - linkml:types
  - ac:ac_common


# ============================================================================
# Enums
# ============================================================================

enums:

  TransformationType:
    description: single transformations[] array with a discriminator.
    permissible_values:
      derivation:
        description: Binds a derivation method to derived concepts.
      analysis:
        description: Binds an analysis method to analysis concepts.

  FHIRValueType:
    description: >-
      Optional value-type constraint on an input measure binding. Mirrors
      the method layer's value types but listed here so the transformation schema
      is self-contained at validation time.
    permissible_values:
      Quantity:
      CodeableConcept:
      Identifier:
      string:
      decimal:
      integer:
      boolean:
      NumericValue:
        description: A value type used by derived concepts.
      CharacterValue:
        description: A value type used by derived concepts.
      CodedResponse:
        description: A value type used by derived concepts.

  SliceKeySource:
    description: >-
      where a slice-key's fixed-dimension value comes from at study-spec
      time. Currently an informal three-value vocabulary in the existing
      library. Listed here as an enum so the
      validator can warn on unknown values.
    permissible_values:
      biomedicalConcept:
        description: Value is the endpoint's linked biomedical concept identifier.
      visit:
        description: Value is the endpoint's chosen analysis visit.
      population:
        description: Value is the endpoint's chosen analysis population.
      event:
        description: Value is the endpoint's clinical event of interest (time-to-event analyses).
      treatment:
        description: Value is a treatment arm of the study design.

  ContrastBasis:
    permissible_values:
      estimated_means:
        description: Columns are the levels/cells of the contrasted factor(s); concept-owned, portable (default).
      model_coefficients:
        description: Columns are the fitted model's parameters; model-bound, needs coding/reference.

  ContrastCoding:
    permissible_values:
      reference:
        description: Reference (treatment) coding — one level absorbed into the intercept.
      cell_means:
        description: Cell-means coding — every level gets its own parameter.

  ContrastGeneratorKind:
    permissible_values:
      pairwise: {}
      vs_reference: {}
      trend: {}
      custom: {}


# ============================================================================
# Classes
# ============================================================================

classes:

  # --- Top level --------------------------------------------------------------

  Any:
    class_uri: linkml:Any
    description: Any value; used for configuration values, whose type depends on the method's configuration.
  TransformationLibrary:
    description: Top-level container for one or more transformations.
    tree_root: true
    attributes:
      libraryVersion:
        description: Semantic version of the library. A study pins the version it uses (decision D6).
        range: string
        required: true
      description:
        range: string
      transformations:
        description: unified array (analyses + derivations merged with a discriminator).
        range: Transformation
        multivalued: true
        inlined: true
        inlined_as_list: true

  Transformation:
    description: a single transformation entry.
    attributes:
      conceptId:
        description: canonical identifier (e.g. T.CFB_ANCOVA).
        range: string
        identifier: true
        required: true
        pattern: "^T\\.[A-Za-z0-9_]+$"
      status:
        description: Lifecycle status; `provisional` marks a template proposed during the candidate v1 build.
        range: EntryStatus
      label:
        description: SmartPhrase-rendering label.
        range: string
        required: true
      shortLabel:
        description: Optional compact label.
        range: string
      transformationType:
        range: TransformationType
        required: true
      description:
        range: string
      usesMethod:
        description: The Method this transformation applies (a Method identifier).
        range: string
        required: true
        pattern: "^M\\.[A-Za-z0-9_]+$"
      methodConfigurations:
        description: Values for the method's configuration options.
        range: MethodConfigurationOverride
        multivalued: true
        inlined: true
        inlined_as_list: true
      inputDataStructure:
        description: the qb:DataStructureDefinition for the cube this transformation consumes.
        range: InputDataStructure
        required: true
        inlined: true
      outputDataStructure:
        description: the qb:DataStructureDefinition for the cube this transformation produces.
        range: OutputDataStructure
        required: true
        inlined: true
      sliceKeys:
        description: declares how slice-template placeholders bind to the endpoint spec at study time.
        range: SliceKey
        multivalued: true
        inlined: true
        inlined_as_list: true
      validSmartPhrases:
        description: SmartPhrase OIDs compatible with this transformation.
        range: string
        multivalued: true

  MethodConfigurationOverride:
    description: A configuration value supplied to the named method's `configurations[].name` slot.
    attributes:
      configurationName:
        description: FK to Method.configurations[].name (validated cross-file).
        range: string
        required: true
      value:
        description: Configuration value (type matches the configuration's dataType).
        range: Any
      valueList:
        description: The value of a list-valued configuration (for example a set of visit windows).
        range: Any
        multivalued: true
      description:
        description: Why this value is set.
        range: string

  # --- DSDs -------------------------------------------------------------------

  DataStructureDefinition:
    description: >-
      abstract base for the input and output DSDs. Each instance
      IS a qb:DataStructureDefinition. Subclasses (InputDataStructure /
      OutputDataStructure) constrain which kinds of bindings are permitted.
    abstract: true
    class_uri: qb:DataStructureDefinition
    attributes:
      dimensions:
        description: qb:dimension components of this DSD.
        slot_uri: qb:dimension
        multivalued: true
        inlined: true
        inlined_as_list: true
      measures:
        description: qb:measure components of this DSD.
        slot_uri: qb:measure
        multivalued: true
        inlined: true
        inlined_as_list: true
      attributes_:  # avoids shadowing LinkML's `attributes` keyword in the metamodel
        description: qb:attribute components of this DSD. Reserved; typically absent.
        slot_uri: qb:attribute
        multivalued: true
        inlined: true
        inlined_as_list: true
      slices:
        description: slice templates that pre-filter cubes derived from this DSD.
        range: Slice
        multivalued: true
        inlined: true
        inlined_as_list: true

  InputDataStructure:
    description: >-
      DSD for the cube the transformation consumes. dimensions[] and
      measures[] items may carry `input` FKs; measures[] items may carry
      `slice`. Output-only fields are rejected.
    is_a: DataStructureDefinition
    slot_usage:
      dimensions:
        range: InputDimensionBinding
      measures:
        range: InputMeasureBinding
      attributes_:
        range: InputAttributeBinding
    attributes:
      modelInteractions:
        description: >-
          interaction terms selected into the model RHS for this use
          (e.g. a treatment-by-visit interaction). Each interaction references
          already-bound input roles via its operands; it binds no new data.
          Main effects are NOT listed here — they are implied by the
          dimensions[]/measures[] input bindings. Empty/absent = main effects
          only. Validated against usesMethod's formula grammar (an
          interaction's operand-role multiset must match an allowed interaction
          production in the method's generic_expression). Input-side only (model
          specification is about the RHS the cube feeds), so it lives here and
          not on OutputDataStructure.
        range: ModelInteraction
        multivalued: true
        inlined: true
        inlined_as_list: true

  OutputDataStructure:
    description: >-
      DSD for the cube the transformation produces. dimensions[] items
      list the output cube's qb:dimension components (no input FK on
      this side). measures[] items carry `output` FKs.
      slice is rejected on output measures.
    is_a: DataStructureDefinition
    slot_usage:
      dimensions:
        range: OutputDimensionBinding
      measures:
        range: OutputMeasureBinding
      attributes_:
        range: OutputAttributeBinding

  # --- Bindings ---------------------------------------------------------------

  ConceptReference:
    description: >-
      Abstract base for any binding that references a clinical/analysis concept
      OR a concept category. Enforces "concept XOR conceptCategory".
    abstract: true
    attributes:
      concept:
        description: >-
          A concrete Concept in the concept library (a Concept identifier, e.g.
          C.Change). Checked across files by the validator.
        range: string
        pattern: "^C\\..+$"
      conceptCategory:
        description: >-
          An abstract Concept that stands for a group (e.g. C.ParameterDimension,
          C.VisitDimension). A concrete member is chosen when a study uses the
          transformation.
        range: string
        pattern: "^C\\..+$"
    rules:
      - description: concept and conceptCategory are mutually exclusive (exactly one is set).
        postconditions:
          exactly_one_of:
            - slot_conditions:
                concept:
                  required: true
            - slot_conditions:
                conceptCategory:
                  required: true

  DimensionBinding:
    description: >-
      Abstract base for an entry in a DSD's dimensions[]. Subclasses constrain
      whether input is permitted.
    is_a: ConceptReference
    abstract: true
    class_uri: qb:ComponentSpecification
    attributes:
      input:
        description: when present, this dim fills a specific method input slot (bound dim). When absent, the dim is pure cube context.
        range: string

  InputDimensionBinding:
    description: a dimension on the input cube. input is optional.
    is_a: DimensionBinding
    slot_usage:
      input:
        required: false

  OutputDimensionBinding:
    description: >-
      a dimension on the output cube. input is rejected here. May
      instead be a derived contrast dimension carrying a contrastSpecification; in that case it is named "contrast" and bound to the
      Contrasts concept.
    is_a: DimensionBinding
    slot_usage:
      input:
        ifabsent: "null"
    attributes:
      name:
        description: Dimension name; "contrast" for a derived contrast dimension.
        range: string
      contrastSpecification:
        description: The coefficient-matrix recipe defining the contrast dimension's members.
        range: ContrastSpecification
        inlined: true
    rules:
      - description: input is rejected on output-side dimension bindings.
        postconditions:
          slot_conditions:
            input:
              required: false
              equals_string: ""
      - description: >-
          A contrast dimension (contrastSpecification present) is derived, so it
          relaxes the concept-XOR-conceptCategory rule and is bound to Contrasts.
        preconditions:
          slot_conditions:
            contrastSpecification: { value_presence: PRESENT }
        postconditions:
          slot_conditions:
            concept: { equals_string: "C.Contrasts" }

  MeasureBinding:
    description: >-
      Abstract base for an entry in a DSD's measures[]. Subclasses constrain
      direction: input measures carry input + optional slice; output
      measures carry output.
    is_a: ConceptReference
    abstract: true
    class_uri: qb:ComponentSpecification
    attributes:
      requiredValueType:
        description: optional FHIR value-type constraint on the input measure.
        range: FHIRValueType
      description:
        description: Free-text note on the binding (e.g. "Baseline value of the endpoint parameter").
        range: string

  InputMeasureBinding:
    description: a measure on the input cube. Carries input; may carry slice.
    is_a: MeasureBinding
    attributes:
      input:
        description: The Method input role this measure fills (Method.inputs[].role).
        range: string
        required: true
      slice:
        description: name of a Slice in inputDataStructure.slices[] that pre-filters this measure's cube before the method sees it.
        range: string

  OutputMeasureBinding:
    description: a measure on the output cube. Carries output; slice is rejected.
    is_a: MeasureBinding
    attributes:
      output:
        description: >-
          The producer of this measure: the identifier of the Method (when it
          has a single output) or of the SubMethod whose output it is.
        range: string
        required: true
        pattern: "^S?M\\..+$"

  # Reserved attribute bindings — present so the schema is closed and future-
  # use cases can land without a breaking change.
  InputAttributeBinding:
    description: Reserved (Attributes). qb:attribute on the input cube.
    is_a: ConceptReference
    class_uri: qb:ComponentSpecification

  OutputAttributeBinding:
    description: Reserved (Attributes). qb:attribute on the output cube.
    is_a: ConceptReference
    class_uri: qb:ComponentSpecification

  # --- Model interactions -----------------------------------------------------

  ModelInteraction:
    description: >-
      one interaction term on the model RHS, selected for this use and
      composed from already-bound input roles (its operands). The interaction
      (the `:` operator) is the only composite term selectable across the
      current method library; nesting/stratification (the `|` partition) is
      method-intrinsic, not a per-use choice, so it is not modelled here. There
      is therefore no `kind` discriminator: a ModelInteraction IS an
      interaction. If the formula grammar later gains a second selectable
      composition production (e.g. random effects `(slope | group)`), that is a
      new, separately-named construct — not a `kind` added here. The eSAP
      renders the model statement from these structured interactions rather than
      parsing a formula string.
    attributes:
      operands:
        description: >-
          The two-or-more interacting factors/covariates, each a reference to an
          existing dimensions[]/measures[] input binding. Order is not
          significant (a:b == b:a).
        range: InteractionOperand
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
      label:
        description: Optional human-readable label (e.g. "Treatment × AnalysisVisit").
        range: string
      role:
        description: >-
          Optional role marker for the interaction, e.g. "primary" for the
          treatment-by-visit term of primary interest in an MMRM.
        range: string

  InteractionOperand:
    description: >-
      one operand of a ModelInteraction. Identifies an existing input
      binding by the SAME identity it uses in dimensions[]/measures[]: its input
      role plus its concept (or conceptCategory). `input` alone is insufficient
      because `multiple`-cardinality roles (e.g. fixed_effect bound to both
      Treatment and Region) would be ambiguous — so the concept disambiguates
      which binding the operand refers to.
    is_a: ConceptReference  # inherits concept-XOR-conceptCategory
    attributes:
      input:
        description: The Method input role this operand fills (Method.inputs[].role).
        range: string
        required: true

  # --- Slices -----------------------------------------------------------------

  Slice:
    description: >-
      a named, parameterized slice TEMPLATE. Instantiated to a real
      qb:Slice at execution time when sliceKey placeholders bind to endpoint
      values. Lives inside a DSD's slices[] array.
    class_uri: qb:Slice
    attributes:
      name:
        description: Slice identifier within slices[]. Referenced by InputMeasureBinding.slice.
        range: string
        identifier: true
        required: true
      description:
        range: string
      constraints:
        description: One constraint per fixed dimension. Values may be literal or {placeholder}.
        range: SliceConstraint
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true

  SliceConstraint:
    description: one fixed dimension within a slice template.
    attributes:
      dimension:
        description: References a dimension name in the parent DSD's dimensions[] (concept or conceptCategory).
        range: string
        required: true
      value:
        description: >-
          Literal value OR a {placeholder} that resolves via sliceKeys at
          study-spec time. Recognized placeholders include {parameter},
          {visit}, {baseline_visit}, {population}.
        range: string
        required: true

  SliceKey:
    description: >-
      qb:SliceKey extended with `source` to declare where the
      fixed-dimension value comes from at study-spec time. Lives at the
      transformation top level.
    class_uri: qb:SliceKey
    attributes:
      dimension:
        description: References a dimension in inputDataStructure.dimensions[].
        slot_uri: qb:componentProperty
        range: string
        required: true
      source:
        description: Endpoint-spec attribute name supplying the value.
        range: SliceKeySource
        required: true

  ContrastSpecification:
    description: >-
      The coefficient matrix L defining a contrast dimension's members. `over` is
      expressed in concept terms (e.g. Treatment). estimated_means is the portable
      default; model_coefficients additionally pins coding (+reference)
    attributes:
      over:
        description: The factor/dimension contrasted, in concept terms (e.g. "Treatment").
        range: string
        required: true
      basis:
        description: Column space of L.
        range: ContrastBasis
        required: true
      at:
        description: Optional second factor; single-factor members are replicated across its levels.
        range: string
      coding:
        description: Required when basis = model_coefficients — the model parameterization.
        range: ContrastCoding
      reference:
        description: Required when basis = model_coefficients and coding = reference — the reference level.
        range: string
      members:
        description: Either a generator (template) or a resolved list of member rows.
        range: ContrastMembers
        inlined: true
        required: true
    rules:
      - description: model_coefficients requires coding (and reference when coding = reference).
        preconditions:
          slot_conditions:
            basis: { equals_string: "model_coefficients" }
        postconditions:
          slot_conditions:
            coding: { required: true }

  ContrastMembers:
    description: A contrast member-set — exactly one of generator (unresolved) or memberList (resolved).
    attributes:
      generator:
        range: ContrastGenerator
        inlined: true
      memberList:
        range: ContrastMember
        multivalued: true
        inlined_as_list: true
    rules:
      - description: exactly one of generator / memberList is present.
        postconditions:
          exactly_one_of:
            - slot_conditions: { generator: { value_presence: PRESENT } }
            - slot_conditions: { memberList: { value_presence: PRESENT } }

  ContrastGenerator:
    description: Study-time generator resolved against `over`'s levels into explicit members.
    attributes:
      kind:
        range: ContrastGeneratorKind
        required: true
      reference:
        description: Comparator level (often the {control_arm} sliceKey), for vs_reference.
        range: string

  ContrastMember:
    description: One row of L — a labelled set of weights (single-factor) or cells (multi-factor).
    attributes:
      label: { range: string, required: true }
      weights:
        description: Single-factor shorthand — map of level -> weight (omitted = 0).
        range: float
        multivalued: true
        inlined: true
      cells:
        description: General multi-factor cells (interaction / difference-in-differences).
        range: ContrastCell
        multivalued: true
        inlined_as_list: true
    rules:
      - description: a member carries weights or cells (at least one).
        postconditions:
          any_of:
            - slot_conditions: { weights: { value_presence: PRESENT } }
            - slot_conditions: { cells: { value_presence: PRESENT } }

  ContrastCell:
    description: A weighted cell mapping each relevant factor to a level.
    attributes:
      cell:
        description: Map of factor (concept term) -> level.
        range: string
        multivalued: true
        inlined: true
      weight: { range: float, required: true }


# ============================================================================
# Cross-file rules
# ============================================================================
#
# These invariants need other library files to check, so they are enforced by
# the validator (v1/tools/validate.py), not by this schema:
#
#   T1  usesMethod names an existing Method.
#   T2  Every `input` names an input role of that Method; every `output` names
#       the Method or one of its SubMethods.
#   T3  methodConfigurations[].configurationName is a configuration of the
#       Method, and its value is one of the allowed values when the
#       configuration lists them.
#   T4  A measure's `slice` names a slice of the same data structure.
#   T5  sliceKeys[].dimension and slice constraints name a dimension of the
#       input data structure.
#   T6  A single-valued Method input is bound once.
#   T7  concept and conceptCategory name Concepts in the concept library;
#       conceptCategory names an abstract one.
#   T8  Every operand of a model interaction matches an input binding, and the
#       interaction is one the Method's formula allows.
#   T9  An output measure's Concept is satisfied by the output it is bound to
#       (the output carries the statistics the Concept is made of).
#   T10 validSmartPhrases name phrases in the SmartPhrase library.
#
# "concept or conceptCategory, not both" is expressed in LinkML, on
# ConceptReference above.
