# Analysis Concepts candidate v1 — common slots
# Origin: model/schema/shared_slots.yaml on model-schema (v0.9.0)
# Changes from the origin are listed in v1/docs/migration-notes.md.
id: https://cdisc.org/ac/common
name: ac_common
version: "1.0.0-candidate"
title: AC Common Slots
description: >-
  Schema for AC (Analysis Concepts) shared slot definitions.

license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  ac: https://cdisc.org/ac/
  linkml: https://w3id.org/linkml/
  NCIT: https://evsexplore.semantics.cancer.gov/evsexplore/concept/ncit/

default_prefix: ac
default_range: string

imports:
  - linkml:types

# ──────────────────────────────────────────────
# Slots
# ──────────────────────────────────────────────

slots:

  # ── Shared slots ───────────────────────────

  conceptId:
    description: Unique identifier
    identifier: true
    required: true

  name:
    description: Human-readable name
    required: true

  label:
    description: Short label for display

  description:
    description: Free-text explanation or description

  codings:
    description: Mappings to external terminology or ontology codes
    multivalued: true
    range: Coding
    inlined_as_list: true

  ncitCode:
    description: NCIt code
    range: string
    pattern: "^(C[0-9]+(_NEW)?)$"
    implicit_prefix: NCIT

  # ── Coding slots ───────────────────────────

  system:
    description: URI identifying the coding system (e.g., http://purl.obolibrary.org/obo/)
    range: uri
    required: true

  code:
    description: The code value within the system (e.g., STATO_0000179)
    required: true

  display:
    description: Human-readable label for the code

  # ── Library and lifecycle slots (added in candidate v1) ──

  libraryVersion:
    description: Semantic version of a library file.
    required: true

  status:
    description: >-
      Lifecycle status of a library entry. `provisional` marks content that was
      proposed during the candidate v1 build and has not been reviewed.
    range: EntryStatus

  valueType:
    description: The kind of value produced, using FHIR datatype names.
    range: ValueTypeEnum

  unitRule:
    description: How the unit of the value is determined.
    range: UnitRuleEnum

  broader:
    description: SKOS-style parent of this entry within the same vocabulary.
    range: string

  abstract:
    description: True for a grouping entry that is never used directly.
    range: boolean

# ──────────────────────────────────────────────
# Classes
# ──────────────────────────────────────────────

classes:

  Coding:
    description: A reference to a code in a terminology or ontology
    slots:
      - system
      - code
      - display

enums:
  EntryStatus:
    description: Lifecycle status of a library entry.
    permissible_values:
      released:
        description: Carried over from a source library.
      provisional:
        description: Proposed during the candidate v1 build; not yet reviewed.
      deprecated:
        description: Kept for reference; do not use in new content.

  ValueTypeEnum:
    description: >-
      The kind of value a statistic or concept produces. Complex types follow
      FHIR R5 datatypes; primitive types follow FHIR primitives.
    permissible_values:
      Quantity:
        description: A measured amount with a unit.
      CodeableConcept:
        description: A coded value.
      Identifier:
        description: An identifier.
      Range:
        description: A low and a high value (for example a confidence interval).
      Ratio:
        description: A relationship between two quantities.
      Count:
        description: A whole number of occurrences.
      Period:
        description: A start and end date/time.
      decimal: {}
      integer: {}
      boolean: {}
      string: {}
      code: {}
      date: {}
      dateTime: {}

  UnitRuleEnum:
    description: How the unit of a produced value is determined.
    permissible_values:
      inherited:
        description: The same unit as the input value(s).
      derived:
        description: A unit derived from the units of the inputs.
      fixed:
        description: A fixed unit.
      unitless:
        description: A pure number.
      none:
        description: Units do not apply.
