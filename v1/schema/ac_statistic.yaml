# Analysis Concepts candidate v1 — statistics vocabulary
# Origin: model/schema/statistic.yaml on model-schema (v0.5.0)
# Changes from the origin are listed in v1/docs/migration-notes.md.
id: https://cdisc.org/ac/statistic
name: ac_statistic
version: "1.0.0-candidate"
title: AC Statistic Model
description: >-
  Schema for AC (Analysis Concepts) statistic definitions.

license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  ac: https://cdisc.org/ac/
  linkml: https://w3id.org/linkml/
  obo: http://purl.obolibrary.org/obo/

default_prefix: ac
default_range: string

imports:
  - linkml:types
  - ac:ac_common

# ──────────────────────────────────────────────
# Classes
# ──────────────────────────────────────────────

classes:

  Statistic:
    exact_mappings:
      - obo:STATO_0000039 # "statistic"
    description: A reusable statistic/measure definition in the vocabulary
    slots:
      - conceptId
      - name
      - label
      - description
      - ncitCode
      - codings
      - status
    slot_usage:
      conceptId:
        description: Unique statistic identifier, e.g., S.AIC, S.BIC
        pattern: "^S\\..+$"
      name:
        description: Statistic identifier, e.g., estimate, p_value, F_statistic
      description:
        description: What this statistic measures

  StatisticLibrary:
    tree_root: true
    description: The vocabulary of statistics that methods produce and analysis concepts are made of.
    slots:
      - libraryVersion
      - description
    attributes:
      entries:
        description: The statistics in the vocabulary.
        range: Statistic
        multivalued: true
        inlined_as_list: true
        required: true

# ──────────────────────────────────────────────
# Slots
# ──────────────────────────────────────────────

slots:

  statistics:
    exact_mappings:
      - obo:OBI_0000299 # "has specified output"
    description: The statistics produced by this method, referencing the statistics vocabulary.
    multivalued: true
    range: Statistic
    inlined: false

