  OccurrenceCriterion:
    x-provenance:
      source: usdm
      conformance: refinement
    x-refines: Condition
    description: 'A refinement of the USDM Condition entity (NCI C25457, "a state of being"), made machine-executable. Per the
      USDM dictionary a Condition appliesTo a BiomedicalConcept, has context a ScheduledActivityInstance/Activity (here the
      hasScheduleTimeline), and carries the condition as Condition.text ("an instance of structured text that represents the
      condition"). This refinement supplies the executable form of that text. BC, property, and ResponseCode form ONE USDM
      containment path (a code is of a property is of a BC — never a cross-product of independent picks), so the criterion
      names that path ONCE: `property` is a path-shaped reference whose id carries its parent BC (the path HEAD, satisfying
      USDM Condition.appliesTo without a separate field); `responseCodes` are LEAVES of that same property; `operator` (the one
      eSAP-added part) gives the comparison USDM''s free-text Condition.text leaves implicit. The instance example''s
      "triggerField=CMCAT, triggerValue=ANTICANCER THERAPY" is the execution-layer projection of property→BC_CM_001/Category,
      operator=in, responseCodes→[the rescue codes]. Use `responseCodes` for coded properties; use `literal` for numeric/date
      thresholds (e.g. dose < 0.75·planned), where no ResponseCode applies. Store/domain/variable resolution is an execution
      concern and stays out of the spec.'
    type: object
    properties:
      property:
        $ref: '#/$defs/BiomedicalConceptPropertyRef'
        description: 'The single entry into the USDM containment path tested — a BiomedicalConceptProperty whose path-shaped id
          carries its parent BiomedicalConcept (e.g. ''BC_CM_001/Category''). The BC is the path HEAD (read from the id, no
          traversal) — it is NOT referenced separately; the matched responseCodes are LEAVES of this same property. So BC,
          property, and code are one path, named once here, never an independent cross-product. USDM Condition.appliesTo (which
          is BC-level) is satisfied by this path''s head.'
      context:
        $ref: '#/$defs/ScheduleTimeline'
        description: USDM Condition.context — the scheduled activity / timeline to which the condition belongs (where the
          concept is collected). Distinct from the ICE's hasScheduleTimeline, which is the event-driven RESPONSE timeline.
      operator:
        type: string
        enum:
        - equals
        - notEquals
        - in
        - notIn
        - lessThan
        - lessThanOrEqual
        - greaterThan
        - greaterThanOrEqual
        - exists
        - notExists
        description: 'The executable comparison applied to the property. eSAP-owned — USDM expresses conditions as free text,
          not structured operators. Value requirement by operator group: PRESENCE (exists, notExists) takes NO value — it tests
          only whether the property is recorded, so neither responseCodes nor literal is given. SCALAR (equals, notEquals,
          lessThan, lessThanOrEqual, greaterThan, greaterThanOrEqual) takes exactly one value — one responseCodes entry for a
          coded property, or literal for a non-coded one. MEMBERSHIP (in, notIn) takes a set — responseCodes with 1..* entries
          (coded properties only).'
      responseCodes:
        type: array
        items:
          $ref: '#/$defs/ResponseCodeRef'
        description: 'Compared-against value(s) when the referenced property is CODED — i.e. its BiomedicalConceptProperty.datatype
          is a coded type and it therefore carries responseCodes[]. References those USDM ResponseCodes (equals/notEquals/in/notIn),
          so values come from the property''s declared codelist, not hardcoded. Used only when the property has response codes.'
      literal:
        type: string
        description: 'Compared-against value when the referenced property is NON-CODED — a numeric/date/boolean BiomedicalConceptProperty
          whose datatype carries no responseCodes[] (e.g. a dose or a date threshold for lessThan/greaterThan/…). A study data value.
          Which value field applies is governed by the property''s datatype; responseCodes and literal are mutually exclusive.'
    required:
    - property
    - operator
    allOf:
    - if:
        properties:
          operator:
            enum:
            - exists
            - notExists
        required:
        - operator
      then:
        description: Presence operators take no value — neither responseCodes nor literal may be present.
        not:
          anyOf:
          - required:
            - responseCodes
          - required:
            - literal
  ScheduleTimeline:
    x-provenance:
      source: usdm
      conformance: reference
    description: 'USDM: A chronological schedule of planned temporal events (USDM-IG §4.14). A StudyDesign has one MAIN timeline
      (mainTimeline=true) plus additional event-driven timelines, each gated by an entryCondition and detailing the steps taken
      under those circumstances (USDM-IG "Unscheduled Visits" pattern — e.g. an "Adverse event" or "Lost contact with subject"
      condition). An ICE timeline is one such event-driven timeline: mainTimeline=false, entryCondition naming the triggering
      event. Attributes per USDM Timeline UML: id, name, label, description, entryCondition (free-text event gate), mainTimeline
      (boolean), plannedDuration (Duration). Relationships: entry, instances, exits, timings. Window bounds live on
      Timing.windowLower/Upper; direction on Timing.type. additionalProperties: true for pass-through of the full USDM Timeline
      payload. USDM owns these on StudyDesign.scheduleTimelines; the eSAP nests the ICE-relevant one as a Model-B copy.'
    type: object
    additionalProperties: true
    properties:
      id:
        type: string
      name:
        type: string
      entryCondition:
        type: string
        description: USDM free-text event gate that fires this timeline — the human-readable condition naming the event (e.g.
          "Subject receives rescue medication", or USDM-IG's "Adverse event" / "Lost contact with subject"). Its structured/machine-readable
          counterpart is IntercurrentEvent.ascertainedBy; the two are the prose and executable halves of one condition.
      mainTimeline:
        type: boolean
        description: True for the StudyDesign's main SoA timeline; false for event-driven timelines (an ICE timeline is always
          mainTimeline=false, gated by entryCondition).
      plannedDuration:
        type: string
    required:
    - id
