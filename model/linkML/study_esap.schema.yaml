$id: https://cdisc.org/acdc/study_esap
$schema: https://json-schema.org/draft/2019-09/schema
title: study_esap
description: 'Study eSAP Model schema. Binds Methods to a study''s objectives, endpoints, and estimands by full-copy of library
  TransformationTemplates: each study Transformation copies its template''s cube structure (twin qb:DataStructureDefinitions),
  slice templates, sliceKeys, methodConfigurations, and validSmartPhrases — and adds study-resolved values (sliceKeys[].value
  filled in, slice constraint {placeholder} tokens substituted, configurationValues, hasPhraseInstance, resolvedExpression).
  The Method is the only library artefact that stays referenced (via usesMethod); everything else is copied so the eSAP is
  self-contained for regulatory reproducibility. Built on the CDISC USDM v4.0 study structure with cross-references to ARS
  Analysis definitions. Aligned with Transformation Library v0.7 (Option B strict twin DSDs per WG method-schema-design 2026-05-27)
  and Method schema v0.9.1 (conceptId-keyed, inputs[]/outputs[] shape). Validates study eSAP instance files.'
version: 0.5.0
type: object
additionalProperties: true
properties:
  model:
    type: string
    const: eSAP
    description: Model identifier
  version:
    type: string
    description: Semantic version of the study eSAP model
  description:
    type:
    - string
    - 'null'
    description: Human-readable description of the model
  $provenance:
    type: object
    description: Declares external model dependencies — bill of materials for referenced entities
    properties:
      usdm:
        type: object
        description: CDISC Unified Study Definitions Model — source for study structure entities
        properties:
          model:
            type: string
            const: CDISC Unified Study Definitions Model
          version:
            type: string
          uri:
            type: string
            format: uri
          entities:
            type: array
            items:
              type: string
            description: USDM entity names referenced in this schema
      transformation_library:
        type: object
        description: 'Reusable Transformation & Method library — source for transformation templates, smart phrases, methods,
          and method outputs. v0.7+: methods are externalised into per-method files (one M_*.json per method); the library
          file itself carries only transformation templates, smartPhrases, and roleDefinitions. Transformation templates use
          twin DataStructureDefinitions (inputDataStructure / outputDataStructure) per W3C qb vocabulary.'
        properties:
          model:
            type: string
          version:
            type: string
            description: Library version (e.g. '0.7')
          schemaRef:
            type: string
            format: uri
          methodsRef:
            type: string
            description: Path or URI pattern for per-method files (e.g. 'lib/methods/{analyses,derivations}/M_*.json')
          entities:
            type: array
            items:
              type: string
      ars:
        type: object
        description: CDISC Analysis Results Standard — source for analysis result definitions
        properties:
          model:
            type: string
          uri:
            type: string
            format: uri
          entities:
            type: array
            items:
              type: string
  study:
    $ref: '#/$defs/Study'
  reportingEvents:
    type: array
    items:
      $ref: '#/$defs/ReportingEvent'
    description: The analysis-specification data — one or more CDISC ARS ReportingEvents (referenced, not reinvented). The SAP
      defines a ReportingEvent per reporting requirement (e.g. an interim analysis, the final CSR), each with its own analyses
      and derivations; all reference the one single-source USDM study structure under `study` (estimands/endpoints/ICEs are
      shared, never copied per event).
required:
- model
- version
- study
$defs:
  ReportingEvent:
    x-provenance:
      source: ars
      conformance: reference
    description: 'CDISC ARS ReportingEvent — the analysis-specification data container for ONE reporting requirement (an interim,
      the final CSR, a DSMB run). Referenced, not reinvented (cf. how Method and USDM are referenced). In ARS it holds
      analysisSets, dataSubsets, methods, analyses, outputs and a listOfContents; those ARS-native members pass through
      (additionalProperties). The SAP may define several ReportingEvents (root reportingEvents[]), each with its own analyses
      and derivations, all referencing the one single-source USDM study definition. The eSAP populates `analyses` (ARS Analysis,
      extended here with the USDM bridge addressesEstimand + AC/DC execution) and adds the AC/DC content ARS has no concept of —
      `derivations`, `iceAscertainments`, `iceHandlings` — each referencing the single-source USDM by id. NB: ARS Analysis has
      no native estimand/endpoint link, so that linkage is the eSAP''s bridge role; ARS expresses
      MainEstimator/Sensitivity/Supplementary via an AnalysisOutputCategorization ("Estimand Analysis Type"), which is what
      Analysis.analysisRole maps to.'
    type: object
    additionalProperties: true
    properties:
      id:
        type: string
        description: ARS ReportingEvent id.
      name:
        type: string
      analyses:
        type: array
        items:
          $ref: '#/$defs/Analysis'
        description: ARS analyses for this reporting event, extended with the USDM bridge (Analysis.addressesEstimand) and
          AC/DC execution (Transformation/cube).
      derivations:
        type: array
        items:
          $ref: '#/$defs/Derivation'
        description: AC/DC-owned derivations (not ARS-native) scoped to this reporting event; each references the USDM Endpoint
          it produces (Derivation.forEndpoint).
      iceAscertainments:
        type: array
        items:
          $ref: '#/$defs/IceAscertainment'
        description: AC/DC-owned per-ICE ascertainment (not ARS-native); each references a USDM IntercurrentEvent.
      iceHandlings:
        type: array
        items:
          $ref: '#/$defs/IceHandling'
        description: AC/DC-owned per-estimand ICE handling (not ARS-native); each references its USDM Estimand and IntercurrentEvent.
      hypotheses:
        type: array
        items:
          $ref: '#/$defs/Hypothesis'
        description: Confirmatory statistical hypotheses for this reporting event (not ARS- or USDM-native). Present only for
          confirmatory analyses; descriptive/exploratory estimands carry none. Each references the USDM Estimand under test.
      multiplicityStrategy:
        $ref: '#/$defs/MultiplicityStrategy'
        description: How family-wise error is controlled across this reporting event's hypotheses (hierarchical / gatekeeping /
          graphical). Per reporting event — interim looks carry their own (group-sequential alpha-spending across looks is the
          orthogonal axis, handled by the looks being separate ReportingEvents).
  Hypothesis:
    x-provenance:
      source: esap
      conformance: owned
    description: 'A confirmatory statistical hypothesis — the inferential bridge between an estimand (the effect) and the
      analysis that tests it. eSAP-owned: neither USDM (design-level: Objective/Endpoint/Estimand) nor ARS (results-level)
      models statistical hypotheses. The verbatim H0/H1 wording stays prose (`statement`, rendered into the SAP document); the
      operative facts are typed. NB: the test level (alpha) is NOT on the hypothesis — it is allocated by the reporting event''s
      MultiplicityStrategy (a function of the procedure and which higher hypotheses were rejected); a single-primary trial is the
      degenerate strategy of one node at familyAlpha.'
    type: object
    properties:
      id:
        type: string
        description: Study-local hypothesis id (referenced by MultiplicityStrategy.order / graph).
      forEstimand:
        type: string
        description: ID of the USDM Estimand whose treatment effect this hypothesis tests. The eSAP-owned hypothesis owns this
          reference into the single-source USDM Estimand.
      hypothesisType:
        type: string
        enum:
        - superiority
        - nonInferiority
        - equivalence
        description: The inferential claim form.
      margin:
        type: number
        description: Non-inferiority / equivalence margin on the estimand's summary-measure scale (omit for superiority).
      statement:
        type: string
        description: PROSE — the verbatim null/alternative wording for the SAP document. Narrative, not machine-acted-on; can be
          rendered from the typed fields (cf. SmartPhrases).
      testedBy:
        type: string
        description: ID of the Analysis that tests this hypothesis — the MainEstimator (analysisRole) addressing the same estimand.
    required:
    - id
    - forEstimand
    - hypothesisType
  MultiplicityStrategy:
    x-provenance:
      source: esap
      conformance: owned
    description: 'Family-wise error control across a reporting event''s hypotheses (the across-hypotheses multiplicity axis;
      across-looks alpha-spending is handled by separate ReportingEvents). eSAP-owned — no CDISC data standard models multiplicity.
      The canonical, general form is the Bretz-Maurer graphical approach (`graph`), which subsumes fixed-sequence, Holm, Hochberg,
      fallback and serial/parallel gatekeeping; `order` is a shorthand for the common pure fixed-sequence (hierarchical) case.
      Give `order` OR `graph` (graph wins if both present). `method` names the procedure for human readability and rendering.'
    type: object
    properties:
      method:
        type: string
        enum:
        - fixedSequence
        - holm
        - hochberg
        - bonferroni
        - fallback
        - graphical
        - gatekeeping
        description: Named multiple-testing procedure (for readability / SAP rendering); the executable truth is order/graph.
      familyAlpha:
        type: number
        description: The family-wise error budget (FWER), e.g. 0.025 one-sided or 0.05 two-sided.
      order:
        type: array
        items:
          type: string
        description: 'Shorthand for fixedSequence: hypothesis ids in test order. Each is tested at familyAlpha only if all
          earlier ones were rejected. Equivalent to the degenerate graph (weights [1,0,…], transitions chaining at weight 1).'
      graph:
        type: object
        description: 'General Bretz-Maurer weighted graph. Per-node initial alpha weights (alpha_i = initialWeight x familyAlpha;
          weights sum to 1) and directed transitions that reallocate a rejected node''s alpha to others (each node''s outgoing
          weights sum to <= 1).'
        properties:
          nodes:
            type: array
            items:
              type: object
              properties:
                hypothesis:
                  type: string
                  description: Hypothesis id.
                initialWeight:
                  type: number
                  description: Fraction of familyAlpha initially allocated to this hypothesis.
              required:
              - hypothesis
              - initialWeight
          transitions:
            type: array
            items:
              type: object
              properties:
                from:
                  type: string
                to:
                  type: string
                weight:
                  type: number
              required:
              - from
              - to
              - weight
    required:
    - method
    - familyAlpha
  IceAscertainment:
    x-provenance:
      source: esap
      conformance: owned
    description: 'eSAP-owned ascertainment overlay for one USDM IntercurrentEvent. Carries what the eSAP adds for an ICE — the
      study-default ICH E9(R1) strategy, the event-driven ScheduleTimeline, and the occurrence ascertainment — WITHOUT modifying
      the locked USDM IntercurrentEvent: it references the ICE by id (forIntercurrentEvent).'
    type: object
    properties:
      forIntercurrentEvent:
        type: string
        description: ID of the USDM IntercurrentEvent this ascertainment is for (matches an IntercurrentEvent.id).
      icheStrategy:
        $ref: '#/$defs/IchE9R1Strategy'
        description: Typed ICH E9(R1) study-default strategy for this ICE. Per-estimand overrides go on IceHandling.icheStrategy.
      hasScheduleTimeline:
        $ref: '#/$defs/ScheduleTimeline'
        description: Typed link to the event-driven ScheduleTimeline for this ICE — a non-main timeline (mainTimeline=false)
          gated by entryCondition (the event that fires it, e.g. "Subject receives rescue medication") whose instances detail
          the protocol-defined response steps. The human-readable gate (entryCondition) pairs with the executable gate
          (ascertainedBy). Per USDM-IG these timelines are owned by StudyDesign.scheduleTimelines.
      ascertainedBy:
        description: 'How this ICE''s per-subject (occurred?, time) fact is obtained — per Subject, a boolean indicator plus a
          Timing. COLLECTED (the common case) → one or more OccurrenceCriterion: each is an executable USDM Condition entering
          the BC ▸ property ▸ code path at a path-shaped property (its head segment is the source BiomedicalConcept); AND-combined.
          DERIVED → a TransformationRef: a Transformation computes occurrence from input BiomedicalConcept(s). Either way the
          result is a per-subject occurrence indicator (occurred, and when), strategy-independent — reused regardless of the
          handling strategy applied via IceHandling. The WHEN (timing window) is hasScheduleTimeline; each criterion''s own
          context is the scheduled activity where its concept is collected.'
        oneOf:
        - type: array
          items:
            $ref: '#/$defs/OccurrenceCriterion'
          minItems: 1
          description: Collected — one or more executable USDM Conditions (AND-combined); each names its BC ▸ property ▸ code path via a path-shaped property ref.
        - $ref: '#/$defs/TransformationRef'
    required:
    - forIntercurrentEvent
  TransformationRef:
    x-provenance:
      source: transformation_library
      conformance: cross-reference
    description: Reference to a TransformationTemplate in the Transformation & Method Library.
    type: object
    properties:
      transformationTemplateId:
        type: string
        description: 'Identifier of the referenced TransformationTemplate — matches the template''s conceptId (e.g. ''T.ChangeFromBaseline'',
          ''T.CFB_ANCOVA''). v0.7+: conceptId replaced the older oid field.'
    required:
    - transformationTemplateId
  SmartPhraseRef:
    x-provenance:
      source: transformation_library
      conformance: cross-reference
    description: Reference to a SmartPhrase template in the Transformation & Method Library.
    type: object
    properties:
      smartPhraseId:
        type: string
        description: Identifier of the referenced SmartPhrase
    required:
    - smartPhraseId
  BiomedicalConceptRef:
    x-provenance:
      source: usdm
      conformance: cross-reference
    description: 'Reference to a USDM BiomedicalConcept — a collected clinical concept (e.g. Concomitant Medication, Disposition,
      Exposure). It is the HEAD of the BiomedicalConcept ▸ Property ▸ ResponseCode containment path: a BiomedicalConceptPropertyRef
      and ResponseCodeRef both begin their path-shaped ids with this concept''s id. Not referenced directly by OccurrenceCriterion
      (which enters the path at the property) — kept as the named path head.'
    type: object
    properties:
      biomedicalConceptId:
        type: string
        description: Identifier of the referenced Biomedical Concept (e.g. 'BC_CM_001' for the Concomitant Medication concept).
          Matches the sourceConceptId used in study instance specifications.
    required:
    - biomedicalConceptId
  BiomedicalConceptPropertyRef:
    x-provenance:
      source: usdm
      conformance: cross-reference
    description: 'Reference to a USDM BiomedicalConceptProperty — a property of a BiomedicalConcept (BiomedicalConcept.properties[]),
      carrying a datatype and, for coded properties, a list of allowed ResponseCodes. Path-shaped id encodes its parent BC
      (a slash-delimited path), so the head BC is readable without traversal and the whole path is self-contained.'
    type: object
    properties:
      biomedicalConceptPropertyId:
        type: string
        description: Path-shaped identifier <biomedicalConceptId>/<property>, e.g. 'BC_CM_001/Category'. The segment before
          the first '/' is the parent BiomedicalConcept (the path head); the remainder names the property.
    required:
    - biomedicalConceptPropertyId
  ResponseCodeRef:
    x-provenance:
      source: usdm
      conformance: cross-reference
    description: 'Reference to a USDM ResponseCode — one of the allowed coded values of a BiomedicalConceptProperty
      (BiomedicalConceptProperty.responseCodes[]); a LEAF of the BC ▸ Property ▸ ResponseCode path. Used as the compared-against
      value in an OccurrenceCriterion over a coded property, so the value is drawn from the property''s declared codelist rather
      than hardcoded. Path-shaped id encodes its property and head BC, keeping it on the same single path.'
    type: object
    properties:
      responseCodeId:
        type: string
        description: Path-shaped identifier <biomedicalConceptId>/<property>/<responseCode>, e.g. 'BC_CM_001/Category/RESCUE'.
    required:
    - responseCodeId
  IchE9R1Strategy:
    x-provenance:
      source: esap
      conformance: owned
    description: ICH E9(R1) strategy for handling an intercurrent event. Five typed values from ICH E9(R1) Step 4 (2019-11-20).
    type: string
    enum:
    - TreatmentPolicy
    - Hypothetical
    - Composite
    - WhileOnTreatment
    - PrincipalStratum
  AnalysisRole:
    x-provenance:
      source: esap
      conformance: owned
    description: The role an Analysis plays for its Estimand per ICH E9(R1).
    type: string
    enum:
    - MainEstimator
    - SensitivityAnalysis
    - SupplementaryAnalysis
  DataStructure:
    x-provenance:
      source: esap
      conformance: owned
    description: Twin qb:DataStructureDefinition shape, copied from the library TransformationTemplate into the study Transformation.
      Each study Transformation's inputDataStructure / outputDataStructure is a distinct qb:DataStructureDefinition with its
      own IRI — even when structurally identical to the library template's. Use inputDataStructure for the consumed qb:DataSet,
      outputDataStructure for the produced qb:DataSet. Direction is encoded structurally — no per-item direction field is
      needed.
    type: object
    properties:
      dimensions:
        type: array
        items:
          $ref: '#/$defs/DimensionEntry'
        description: qb:dimension components of this DSD.
      measures:
        type: array
        items:
          $ref: '#/$defs/MeasureEntry'
        description: qb:measure components of this DSD.
      slices:
        type: array
        items:
          $ref: '#/$defs/SliceTemplate'
        description: qb:Slice templates — fixed-dimension subsets of the DataSet. In a study Transformation, any {placeholder}
          tokens in constraint values are substituted in-place with the resolved values from sliceKeys[].value.
  DimensionEntry:
    x-provenance:
      source: esap
      conformance: owned
    description: A qb:dimension component of a DataStructure. Direction is encoded structurally by which DSD the entry lives
      in (inputDataStructure → input slot; outputDataStructure → output slot).
    type: object
    properties:
      input:
        type: string
        description: When present, FK to method.inputs[].name — declares which method input slot this dimension fills (typically
          a factor / fixed_effect role). Only meaningful inside inputDataStructure.
      output:
        type: string
        description: When present, FK to method.outputs[].name — declares which method output slot this dimension indexes.
          Only meaningful inside outputDataStructure.
      concept:
        type: string
        description: Concept bound to this dimension (e.g., 'Treatment', 'Subject'). The study may override the library template's
          concept here for narrower study-specific binding.
      conceptCategory:
        type: string
        description: Concept category bound to this dimension (e.g., 'ParameterDimension', 'VisitDimension'). Alternative
          to `concept` when binding to a category rather than a specific concept.
  MeasureEntry:
    x-provenance:
      source: esap
      conformance: owned
    description: A qb:measure component of a DataStructure. Direction is encoded structurally by which DSD the entry lives
      in.
    type: object
    properties:
      input:
        type: string
        description: When present, FK to method.inputs[].name — declares which method input slot this measure fills (typically
          the response / covariate). Only meaningful inside inputDataStructure.
      output:
        type: string
        description: When present, FK to method.outputs[].name — declares which method output slot this measure carries. Only
          meaningful inside outputDataStructure.
      concept:
        type: string
        description: Concept bound to this measure (e.g., 'Change', 'Measure', 'LSMeans'). The study may override the library
          template's concept for narrower study-specific binding.
      requiredValueType:
        type:
        - string
        - 'null'
        description: Required FHIR/data type for the bound concept (e.g. 'Quantity', 'CodeableConcept').
      slice:
        type: string
        description: Name reference to a SliceTemplate in this DataStructure's slices[] — restricts this measure to a specific
          cube slice.
      description:
        type: string
  SliceTemplate:
    x-provenance:
      source: esap
      conformance: owned
    description: A qb:Slice — a fixed-dimension subset of the DataSet. Copied from the library template. In a study Transformation,
      any {placeholder} tokens in constraint values are substituted in-place with the resolved values from sliceKeys[].value;
      the resolved values remain auditable via sliceKeys[].value alongside the source field.
    type: object
    properties:
      name:
        type: string
      description:
        type: string
      constraints:
        type: array
        items:
          $ref: '#/$defs/SliceConstraint'
    required:
    - name
  SliceConstraint:
    x-provenance:
      source: esap
      conformance: owned
    description: A single constraint on a slice — pins a dimension to a specific value. In library templates the value may
      carry a {placeholder} token (e.g. '{parameter}'); in study Transformations, tokens are substituted in-place with the
      resolved value from the corresponding sliceKeys[] entry.
    type: object
    properties:
      dimension:
        type: string
        description: Dimension name being constrained (e.g., 'ParameterDimension', 'VisitDimension', 'Population').
      value:
        type: string
        description: Concrete value constraining the dimension. May carry a {placeholder} token in library templates; substituted
          in-place in study copies.
    required:
    - dimension
    - value
  SliceKey:
    x-provenance:
      source: esap
      conformance: owned
    description: A placeholder binding for the transformation. Library templates author this as {dimension, source} declaring
      the placeholder name and where its value is sourced from in the endpoint spec. Study Transformations add `value` filling
      in the resolved placeholder. The resolved value is also substituted in-place into matching {placeholder} tokens in slice
      constraint values, so consumers don't need to do placeholder lookup at consumption time — sliceKeys[].value remains
      for audit and re-rendering.
    type: object
    properties:
      dimension:
        type: string
        description: Placeholder name (e.g., 'ParameterDimension', 'VisitDimension', 'Population'). Also the {token} that
          appears in slice constraint values inside the library template.
      source:
        type: string
        description: Provenance — where this placeholder's value comes from in the endpoint spec (e.g., 'biomedicalConcept',
          'visit', 'population').
      value:
        type: string
        description: Study-resolved value filling the placeholder. Added by the eSAP author when the study Transformation
          is copied from the library template; absent in library templates.
    required:
    - dimension
  MethodConfiguration:
    x-provenance:
      source: esap
      conformance: owned
    description: A per-template default override of a method configuration parameter — copied verbatim from the library TransformationTemplate's
      methodConfigurations[]. Distinct from a study-resolved Configuration (which carries the actual study value).
    type: object
    properties:
      configurationName:
        type: string
        description: Configuration parameter name — matches method.configurations[].name.
      value:
        type: string
        description: Default value the template specifies. May be further overridden by Transformation.configurationValues
          at the study level.
    required:
    - configurationName
    - value
  Configuration:
    x-provenance:
      source: esap
      conformance: owned
    description: A study-resolved configuration parameter value for a study Transformation. Overrides the template-level MethodConfiguration
      default and the Method's defaultValue.
    type: object
    properties:
      name:
        type: string
        description: Configuration parameter name — matches method.configurations[].name (e.g. 'ss_type', 'alpha', 'imputation').
      value:
        type: string
        description: Study-resolved value for this configuration parameter.
    required:
    - name
    - value
  PhraseInstance:
    x-provenance:
      source: esap
      conformance: owned
    description: A resolved SmartPhrase — a template phrase with study-specific parameter values filled in
    type: object
    properties:
      basedOn:
        $ref: '#/$defs/SmartPhraseRef'
        description: The SmartPhrase template this resolved phrase is based on
      resolvedText:
        type: string
        description: The fully resolved text with all parameters substituted
    required:
    - basedOn
    - resolvedText
  ResolvedExpression:
    x-provenance:
      source: esap
      conformance: owned
    description: A method formula resolved with study-level concept bindings — the method provides the template, the transformation
      provides bindings, the study resolves to actual concepts and interactions
    type: object
    properties:
      notation:
        type: string
        enum:
        - assignment
        - wilkinson_rogers
        - survival
        description: Formula notation system from the method
      resolved:
        type: string
        description: The fully resolved expression with study-level concept names substituted (e.g., 'C.Change ~ C.Measure@Baseline
          + Treatment + Site')
      interactions:
        type: array
        items:
          type: string
        description: Active interaction terms in the resolved expression (e.g., ['C.Measure@Baseline:Treatment'])
    required:
    - notation
    - resolved
  OutputClassConfig:
    x-provenance:
      source: esap
      conformance: owned
    description: Study-level output dimension selection for a specific method output — restricts which method-declared indexed_by[]
      dimensions to include in the reported output. When absent for an output, all indexed_by[] dimensions are included.
    type: object
    properties:
      outputClass:
        type: string
        description: Name of the method output (e.g. 'type3_tests_f', 'ls_means', 'contrasts_t') — matches method.outputs[].name
          on the method invoked via the transformation's usesMethod.
      selectedDimensions:
        type: array
        items:
          type: string
        description: Subset of the output's indexed_by[] terms to include. Uses method-input role names or interaction tokens
          (e.g. 'fixed_effect', 'covariate:fixed_effect') from method.outputs[name].indexed_by[].
    required:
    - outputClass
    - selectedDimensions
  IceHandling:
    x-provenance:
      source: esap
      conformance: owned
    description: Per-estimand ICE handling — a reified (Estimand, IntercurrentEvent, Strategy) triple. Lives in
      ReportingEvent.iceHandlings and references its Estimand and IntercurrentEvent by id (neither is modified). Use when
      an estimand's strategy for an ICE differs from the study-default strategy carried on the ICE's IceAscertainment (e.g.,
      primary estimand uses Hypothetical while a sensitivity estimand uses TreatmentPolicy on the same ICE).
    type: object
    properties:
      forEstimand:
        type: string
        description: ID of the USDM Estimand whose ICE handling this is. The eSAP-owned handling owns this reference into the
          locked USDM Estimand (which no longer nests handlings).
      forIntercurrentEvent:
        type: string
        description: ID of the IntercurrentEvent this handling pertains to (matches an IntercurrentEvent.id under the same
          estimand)
      icheStrategy:
        $ref: '#/$defs/IchE9R1Strategy'
        description: The ICH E9(R1) strategy this estimand applies to the referenced ICE
      implementedBy:
        type: array
        items:
          type: object
          properties:
            transformationId:
              type: string
              description: ID of the Transformation (typically a Derivation in ReportingEvent.derivations) that
                operationalises this strategy
          required:
          - transformationId
        description: 'Transformation step(s) that operationalise this IceHandling''s strategy. Patterns: Composite → derivation
          folding the ICE into the variable; Hypothetical → imputation derivation; TreatmentPolicy → omitted (data used as
          observed); WhileOnTreatment → censoring derivation; PrincipalStratum → population-subsetting derivation. Multi-valued
          — a single strategy may split across several steps. Optional — TreatmentPolicy has no implementing transformation.'
    required:
    - forEstimand
    - forIntercurrentEvent
    - icheStrategy
  Transformation:
    x-provenance:
      source: esap
      conformance: owned
    description: 'A study-level transformation — a full copy of a library TransformationTemplate with study-specific resolutions.
      The Method is the only library artefact that stays referenced (via usesMethod); cube structure (twin DSDs), slice templates,
      sliceKeys, methodConfigurations, and validSmartPhrases are copied verbatim from the basedOn template and may be modified
      in-place for study specifics (e.g., concept narrowing on a measure, study override of a default configuration value).
      The study fills sliceKeys[].value and substitutes the resolved values in-place into matching {placeholder} tokens in
      slice constraint values, so consumers can read the eSAP without re-resolving against the library.


      Direction encoding: no explicit direction field exists anywhere on bindings — direction is structural via inputDataStructure
      vs outputDataStructure. The discriminator fields of the older Binding shape (direction, methodRole, dataStructureRole)
      collapse into structural placement: methodRole → DimensionEntry.input/output or MeasureEntry.input/output FK; dataStructureRole
      → dimensions[] vs measures[] array.


      Cube identity: each study Transformation''s inputDataStructure and outputDataStructure is a distinct qb:DataStructureDefinition
      with its own IRI, even when structurally identical to the library template''s. Study-specific overrides live in-place
      on the copied cube.'
    type: object
    properties:
      id:
        type: string
        description: Optional study-local identifier for this transformation. Required when an IceHandling.implementedBy needs
          to reference it.
      sequence:
        type: integer
        description: Execution order within the parent transformation list.
      basedOn:
        $ref: '#/$defs/TransformationRef'
        description: Provenance — the library TransformationTemplate this study Transformation was copied from.
      transformationType:
        type: string
        enum:
        - analysis
        - derivation
        description: Copied from the library template.
      usesMethod:
        type: string
        description: Method conceptId (e.g. 'M.ANCOVA', 'M.Subtraction'). The only library artefact that stays referenced
          rather than copied — the method body lives in the methods catalogue and is not inlined here.
      label:
        type: string
      shortLabel:
        type: string
      description:
        type: string
      inputDataStructure:
        $ref: '#/$defs/DataStructure'
        description: Cube structure for the input qb:DataSet — copied from the library template. Study may override concept
          fields on dimensions/measures for study-specific narrowing.
      outputDataStructure:
        $ref: '#/$defs/DataStructure'
        description: Cube structure for the output qb:DataSet — copied from the library template. Study may override concept
          fields for study-specific narrowing.
      sliceKeys:
        type: array
        items:
          $ref: '#/$defs/SliceKey'
        description: Placeholder bindings — copied from the library template; the study adds a `value` to each entry filling
          in the placeholder. Slice constraint values in inputDataStructure.slices[] (and outputDataStructure.slices[], if
          any) have their matching {placeholder} tokens substituted in-place with these values.
      methodConfigurations:
        type: array
        items:
          $ref: '#/$defs/MethodConfiguration'
        description: Per-template default overrides of method configurations — copied from the library template.
      validSmartPhrases:
        type: array
        items:
          type: string
        description: IDs of SmartPhrase templates valid for this transformation — copied from the library template.
      configurationValues:
        type: array
        items:
          $ref: '#/$defs/Configuration'
        description: Study-resolved configuration values for this transformation — overrides methodConfigurations defaults
          and the Method's defaultValue.
      hasPhraseInstance:
        type: array
        items:
          $ref: '#/$defs/PhraseInstance'
        description: Resolved SmartPhrase texts — the subset of validSmartPhrases this transformation actually realises with
          study-specific parameter values.
      resolvedExpression:
        $ref: '#/$defs/ResolvedExpression'
        description: The method formula resolved with study-level concept bindings and active interactions.
      hasOutputConfig:
        type: array
        items:
          $ref: '#/$defs/OutputClassConfig'
        description: Optional per-output dimension selection. When absent, all method-declared indexed_by[] dimensions are
          included for each output.
    required:
    - sequence
    - basedOn
    - transformationType
    - usesMethod
  Derivation:
    x-provenance:
      source: esap
      conformance: owned
    description: A study-level derivation — instantiates a TransformationTemplate to derive a variable. Lives in
      ReportingEvent.derivations and OPTIONALLY references the USDM Endpoint it produces (the Endpoint no longer nests
      derivations). forEndpoint is 0..1 — a derivation may produce an analysis variable for an endpoint, or it may produce an
      intermediate / collected-data summary that feeds other transformations and maps to no endpoint of its own.
    allOf:
    - $ref: '#/$defs/Transformation'
    - type: object
      properties:
        forEndpoint:
          type: string
          description: ID of the USDM Endpoint this derivation produces the analysis variable for (0..1). The eSAP-owned
            derivation owns this reference into the locked USDM Endpoint. Omit for endpoint-independent derivations (intermediate
            or collected-data summaries).
  Analysis:
    x-provenance:
      source: esap
      conformance: owned
    description: 'A study-level analysis — an ARS Analysis (it lives in ReportingEvent.analyses, so it IS the ARS analysis, not
      a pointer to one). It is-a Transformation (carries usesMethod, the cube DSDs, hasOutputConfig, …) and adds just the
      things ARS lacks: the USDM bridge (addressesEstimand / addressesEndpoint / addressesObjective) and the AC/DC summary-output
      pointer (summaryOutput). The bridge is OPTIONAL: an analysis anchors to the scientific-question spine
      (Objective → Endpoint → Estimand) at whatever altitude fits — estimand (confirmatory), endpoint (descriptive), objective
      (supportive), or nothing at all (operational outputs: disposition, demographics, exposure, deviations). Like native ARS,
      an analysis is valid with no anchor; the anchors are roles it MAY play, not a tax every analysis pays.'
    allOf:
    - $ref: '#/$defs/Transformation'
    - type: object
      properties:
        addressesEstimand:
          type: string
          description: ID of the USDM Estimand this analysis addresses (0..1). The eSAP-owned analysis owns this reference into
            the locked USDM Estimand — the USDM↔ARS bridge link ARS itself does not carry. Present for estimand-framed
            (typically confirmatory) analyses; for each estimand that has analyses, exactly one should be the MainEstimator (via
            analysisRole). Omit for analyses that anchor lower on the spine (addressesEndpoint / addressesObjective) or not at all.
        addressesEndpoint:
          type: string
          description: ID of the USDM Endpoint this analysis addresses (0..1) when it serves an endpoint but no specific estimand
            (e.g. descriptive secondary-endpoint summaries). The eSAP-owned analysis owns this reference into the locked USDM
            Endpoint. Mutually informative with addressesEstimand — an estimand-anchored analysis need not also set this.
        addressesObjective:
          type: string
          description: ID of the USDM Objective this analysis addresses (0..1) when it serves a study goal but no specific
            endpoint or estimand (e.g. supportive safety summaries). The eSAP-owned analysis owns this reference into the locked
            USDM Objective. Operational/administrative outputs (disposition, demographics, exposure, protocol deviations) carry
            none of the three anchors.
        analysisRole:
          $ref: '#/$defs/AnalysisRole'
          description: The role this analysis plays for its Estimand per ICH E9(R1) — MainEstimator (exactly one per estimand),
            SensitivityAnalysis, or SupplementaryAnalysis. These three are ICH-defined values, typed here for validation. ARS has
            no built-in role enum — it supplies only a generic AnalysisOutputCategorization (implementer-defined categories), so
            on ARS export this becomes Analysis.categoryIds → an "Estimand Analysis Type" AnalysisOutputCategorization whose
            categories are these roles. ARS provides the envelope; ICH E9(R1) provides the values.
        summaryOutput:
          type: string
          description: Which of the analysis's own method outputs is the summary measure — an outputs[].name within the method
            referenced by Transformation.usesMethod (e.g. 'contrasts_t' when usesMethod is M.ANCOVA). The method is NOT restated
            here; it is already on the parent Transformation (usesMethod). Resolves against that method's outputs[].
